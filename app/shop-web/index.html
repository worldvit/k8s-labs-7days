<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillBoost Shop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
  header { background: #0f1b3d; color: #fff; padding: 20px 32px; }
  header small { color: #9db8f5; }
  main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
  .meta { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .badge { background: #fef3c7; color: #92400e; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<header><h1 id="title">SkillBoost Shop</h1><small>Kubernetes 7일 과정 실습 쇼핑몰</small></header>
<main>
  <div class="meta" id="meta">상품 정보를 불러오는 중...</div>
  <div class="grid" id="grid"></div>
</main>
<script>
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/products')
  .then(r => r.json().then(body => ({ ok: r.ok, body })))
  .then(({ ok, body }) => {
    if (!ok) throw new Error(body.error || 'API error');
    document.getElementById('title').textContent = body.title;
    document.getElementById('meta').textContent =
      `API ${body.version} · 데이터 ${body.source} · 응답 Pod ${body.pod}`;
    document.getElementById('grid').innerHTML = body.items.map(p =>
      `<div class="card"><h3>${esc(p.name)}</h3><p>${Number(p.price).toLocaleString()}원 · 재고 ${esc(p.stock)}</p>` +
      (p.badge ? `<span class="badge">${esc(p.badge)}</span>` : '') + `</div>`).join('');
  })
  .catch(e => {
    document.getElementById('meta').innerHTML = `<div class="error">API 연결 실패: ${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
