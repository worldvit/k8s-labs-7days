# shop-web nginx 설정 (6장에서 ConfigMap으로 주입)
# /api 요청을 shop-api Service로 전달한다. Service가 없는 2~3일차에는 정적 화면만 확인한다.
server {
    listen 80;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://shop-api:5000;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
