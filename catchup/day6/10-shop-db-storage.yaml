apiVersion: v1
kind: PersistentVolume
metadata:
  name: shop-db-pv
  labels:
    app: shop
    tier: db
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 10.20.1.10
    path: /srv/nfs/shop-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-db-data
  namespace: shop
  labels:
    app: shop
    tier: db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: shop-db-pv
  resources:
    requests:
      storage: 5Gi
