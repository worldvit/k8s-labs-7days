apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: shop
  annotations:
    kubernetes.io/change-cause: "NFS 리포트 볼륨 추가"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shop
      tier: web
  template:
    metadata:
      labels:
        app: shop
        tier: web
        version: v1
    spec:
      nodeSelector:
        tier: front
      initContainers:
        - name: log-agent
          image: busybox:1.37
          restartPolicy: Always
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          command: ["sh", "-c", "touch /var/log/nginx/access.log; tail -F /var/log/nginx/access.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: report
              mountPath: /usr/share/nginx/report
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: html
          configMap:
            name: shop-web-html
        - name: nginx-conf
          configMap:
            name: shop-web-nginx
        - name: report
          persistentVolumeClaim:
            claimName: shop-share
