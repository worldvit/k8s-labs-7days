apiVersion: v1
kind: Pod
metadata:
  name: shop-web
  namespace: shop
  labels:
    app: shop
    tier: web
    version: v1
spec:
  initContainers:
    - name: log-agent
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "touch /var/log/nginx/access.log; tail -F /var/log/nginx/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
  containers:
    - name: nginx
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: logs
      emptyDir: {}
    - name: html
      configMap:
        name: shop-web-html
