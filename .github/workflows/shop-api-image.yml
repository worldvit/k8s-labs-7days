name: shop-api image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/shop-api/**"
      - ".github/workflows/shop-api-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v1, v2]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app/shop-api
          platforms: linux/amd64
          build-args: APP_VERSION=${{ matrix.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skillboost-api:${{ matrix.version }}
